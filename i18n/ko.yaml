- id: carousel2Desc
  translation: "<ul class=\"list-style-none\"><li>제조 기업을 위한 종합 솔루션</li><li>로봇 워크스테이션과 유연 생산 라인</li><li>데이터 기반 생산 관리</li></ul>"
- id: carousel3Title
  translation: "AI 알고리즘 및 맞춤 개발"
- id: carousel3Desc
  translation: "<ul class=\"list-style-none\"><li>머신 비전 및 인식 알고리즘</li><li>업종별 맞춤 애플리케이션 개발</li><li>설계부터 납품까지 원스톱</li></ul>"
- id: feature1Name
  translation: "업종별 솔루션"
- id: feature1Desc
  translation: "가정, 정원, 공원, 상업 공간을 위한 AI 로봇 응용 전문 기업으로 원스톱 맞춤 솔루션을 제공합니다. 스마트 물건 찾기, 레이저 제초, 스마트 모기 퇴치, 소독 작업을 포괄하며 맞춤 적용과 구축으로 스마트화 요구를 해결합니다."
- id: feature2Name
  translation: "로봇 연구개발"
- id: feature2Desc
  translation: "자체 완결형 연구개발 역량을 보유하고 있습니다. 생체모방 4족 보행 로봇, 승강 모듈, AI 비전 짐벌, 레이저 작업 시스템을 심층 연구하며 구조·하드웨어·알고리즘·기능의 전 과정 개발과 반복 개선을 수행하고 다양한 지능형 로봇을 맞춤 제작합니다."
- id: feature3Name
  translation: "스마트 제조"
- id: feature3Desc
  translation: "표준화된 스마트 제조 체계를 구축하여 로봇 조립, 정밀 검사, 에이징 테스트의 일체화 양산을 실현했습니다. 엄격한 품질 관리로 안정적이고 안전한 제품을 보장하며 표준 및 맞춤 대량 주문을 효율적으로 수주합니다."
- id: feature4Name
  translation: "AI 비전 알고리즘"
- id: feature4Desc
  translation: "자체 개발한 고정밀 AI 비전 알고리즘은 물체 인식, 잡초 판별, 모기 추적, 인체 회피 등을 지원합니다. 다각도 작업에 적응하며 목표와 무관한 객체를 정확히 구분하고 소프트웨어·하드웨어 이중 보호로 정확하고 안전한 작업을 보장합니다."
- id: feature5Name
  translation: "로봇 판매"
- id: feature5Desc
  translation: "온라인·오프라인 통합 판매 체계로 자체 개발한 물건 찾기, 제초, 고·저공 모기 퇴치 전 라인 로봇을 판매합니다. 가정·공원·상업 공간에 본체 판매, 맞춤 구매, 완전한 애프터서비스 제공."
- id: feature6Name
  translation: "로봇 프랜차이즈"
- id: feature6Desc
  translation: "전국에서 로봇 사업 프랜차이즈를 모집합니다. 지역 에이전트, 딜러, 창업 파트너를 모집합니다. 자체 연구개발·자체 생산, 충분한 이윤, 낮은 진입 장벽. 본사가 제품·기술·마케팅·애프터서비스를 전면 지원합니다."