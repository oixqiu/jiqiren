  translation: "스마트 로봇 솔루션"
- id: carousel1Desc
  translation: "<ul class=\"list-style-none\"><li>산업용 로봇 본체와 핵심 부품</li><li>생산 라인 자동화 및 스마트화</li><li>AI 비전·알고리즘·클라우드 플랫폼</li><li>24시간 365일 기술 지원</li></ul>"
- id: carousel2Title
