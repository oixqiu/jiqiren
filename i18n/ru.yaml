- id: feature1Name
  translation: "Отраслевые решения"
- id: feature1Desc
  translation: "Специализируемся на применении ИИ-роботов в бытовых, садовых, парковых и коммерческих сценариях, предлагая комплексные индивидуальные решения. Охватываем интеллектуальный поиск предметов, лазерное удаление сорняков, интеллектуальную борьбу с комарами и дезинфекцию, адаптируя решения под задачи интеллектуальной модернизации."
- id: feature2Name
  translation: "Робототехника НИОКР"
- id: feature2Desc
  translation: "Обладаем полным циклом собственных разработок. Эксперты в бионических четвероногих роботах, подъёмных модулях, ИИ-видеостабилизаторах и лазерных системах — развиваем конструкции, аппаратное обеспечение, алгоритмы и функции, создавая настраиваемые роботы."
- id: feature3Name
  translation: "Интеллектуальное производство"
- id: feature3Desc
  translation: "Создали стандартизированную систему интеллектуального производства: сборка, точный контроль и испытания на надёжность. Строгий контроль качества гарантирует стабильные и безопасные продукты, эффективно выполняем стандартные и индивидуальные заказы."
- id: feature4Name
  translation: "ИИ-алгоритмы компьютерного зрения"
- id: feature4Desc
  translation: "Собственные высокоточные ИИ-алгоритмы зрения: распознавание объектов, идентификация сорняков, отслеживание комаров и обход препятствий. Работают под разными углами, точно различают цели с двойной программно-аппаратной защитой."
- id: feature5Name
  translation: "Продажа роботов"
- id: feature5Desc
  translation: "Интегрированные онлайн- и офлайн-продажи всей линейки собственных роботов: поиск предметов, удаление сорняков и борьба с комарами на высокой и низкой высоте. Для дома, парков и бизнеса: продажа техники, индивидуальные закупки и полное сервисное обслуживание."
- id: feature6Name
  translation: "Франчайзинг робототехники"
- id: feature6Desc
  translation: "Открываем франчайзинг по всей стране: региональные агенты, дистрибьюторы и партнёры-предприниматели. Собственные разработки и производство, достаточная маржа и низкий порог входа; головной офис оказывает полную поддержку по продукту, технологиям, маркетингу и сервису."