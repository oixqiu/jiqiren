- id: feature3Name
  translation: "スマート製造"
- id: feature3Desc
  translation: "標準化されたスマート製造体制を構築し、組立・精密検査・エージングテストの一貫量産を実現。厳格な品質管理で安定・安全な製品を保証し、標準品・カスタムの量産注文を効率的に受注します。"
- id: feature4Name
  translation: "AIビジョンアルゴリズム"
