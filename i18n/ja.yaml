- id: feature6Name
  translation: "ロボットフランチャイズ"
- id: feature6Desc
  translation: "全国でロボット事業のフランチャイズを募集。地域代理店・販売店・起業パートナーを募集中。自社開発・自社生産、十分な利益、低い参入障壁。本社が製品・技術・マーケティング・アフターサービスを全面的に支援します。"